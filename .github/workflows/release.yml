name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: storytold/craft-common-actions/.github/workflows/release.yml@main
    with:
      app-name: deckcraft
      app-title: DeckCraft
      craft-fonts-ref: 43913056ce82a3fdad0ef69f6b88d1dc922a8104
      version: ${{ inputs.version }}
    secrets: inherit
